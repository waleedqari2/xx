<style>
/* Layout: a manuscript-like page — header seal, five section panels, each with its clips as buttons; a player sheet opens over the page. */
:root{
  --paper:#F7F0E2; --card:#FFFBF4; --ink:#3B2A1F; --muted:#8A7462; --brown:#6B4423; --brown-l:#C9A27E; --gold:#B98A52;
  --mint:#A9DCC8; --mint-d:#2F6B57; --mint-l:#E6F4EE; --lav:#D9C8EC; --lav-d:#5B3F80; --pink:#F4C4D2; --pink-d:#8A3556; --peach:#F7CDA8; --peach-d:#8A4A1A;
  --display:"Noto Kufi Arabic", "Segoe UI", Tahoma, sans-serif; --body:"Noto Naskh Arabic", "Traditional Arabic", serif;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{direction:rtl}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px 48px;
  background-image:radial-gradient(circle at 12% 0%, rgba(169,220,200,.35), transparent 40%),radial-gradient(circle at 90% 6%, rgba(244,196,210,.30), transparent 38%);}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{position:relative;text-align:center;background:var(--card);border:2px solid var(--brown-l);border-radius:28px;padding:26px 18px 22px;box-shadow:0 10px 30px rgba(107,68,35,.10);overflow:hidden}
header::before{content:"";position:absolute;inset:8px;border:1.5px dashed rgba(185,138,82,.45);border-radius:22px;pointer-events:none}
.seal{width:64px;height:auto;display:block;margin:0 auto 6px}
h1{font-family:var(--display);font-weight:800;color:var(--brown);font-size:clamp(24px,4.6vw,36px);line-height:1.5;margin:4px 0;text-wrap:balance}
.sub{font-family:var(--display);font-weight:500;color:var(--muted);font-size:14px;margin:0}
.meter{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:center;margin-top:14px;font-family:var(--display);font-size:13.5px;color:var(--brown)}
.chipx{white-space:nowrap;background:#F5EAD6;border:1.5px solid var(--brown-l);border-radius:999px;padding:4px 14px;font-weight:700}
.clip .du{display:block;font-family:var(--display);font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.bar{width:min(320px,60vw);height:10px;border-radius:6px;background:#EFE2CB;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--mint-d));border-radius:6px}
.star{width:22px;height:22px;position:relative;display:inline-block;flex:none}
.star::before,.star::after{content:"";position:absolute;inset:3px;background:var(--gold);border-radius:2px}
.star::after{transform:rotate(45deg)}
section.sec{background:var(--card);border-radius:24px;border:1.5px solid var(--brown-l);padding:18px 18px 20px;box-shadow:0 6px 18px rgba(107,68,35,.07)}
.sec h2{display:flex;align-items:center;gap:12px;margin:0 0 14px;font-family:var(--display);font-weight:800;font-size:clamp(17px,3vw,21px);color:var(--brown);line-height:1.6}
.sec h2 .num{font-size:13px;font-weight:700;color:#fff;background:var(--brown);border-radius:999px;padding:2px 12px;white-space:nowrap}
.sec h2 small{margin-inline-start:auto;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.s1{--acc:var(--mint-d);--soft:var(--mint-l)} .s2{--acc:var(--lav-d);--soft:#F2ECF9} .s3{--acc:var(--pink-d);--soft:#FBEAEF} .s4{--acc:var(--peach-d);--soft:#FCEEE0} .s5{--acc:var(--brown);--soft:#F5EAD6}
.sec{border-top:6px solid var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.clip{display:flex;align-items:center;gap:12px;width:100%;text-align:right;font:inherit;color:var(--ink);background:var(--soft);border:1.5px solid transparent;border-radius:16px;padding:12px 14px;cursor:pointer;min-width:0;transition:transform .15s, border-color .15s, box-shadow .15s}
.clip:hover:not([disabled]){transform:translateY(-2px);border-color:var(--acc);box-shadow:0 6px 14px rgba(107,68,35,.12)}
.clip:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.clip .n{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;color:#fff;background:var(--acc)}
.clip .t{flex:1;min-width:0;font-family:var(--display);font-weight:700;font-size:14.5px;line-height:1.6}
.clip .st{flex:none;font-family:var(--display);font-size:12px;font-weight:700;color:var(--acc)}
.clip .play{flex:none;width:30px;height:30px;border-radius:50%;background:var(--card);display:grid;place-items:center;border:1.5px solid var(--acc)}
.clip .play::before{content:"";border-style:solid;border-width:7px 11px 7px 0;border-color:transparent var(--acc) transparent transparent;margin-inline-start:-3px}
.clip[disabled]{cursor:default;opacity:.62;background:#F6F1E8}
.row{display:flex;gap:8px;align-items:stretch;min-width:0}
.row .clip{flex:1}
.dl{flex:none;width:52px;border-radius:16px;border:1.5px solid var(--acc);background:var(--card);color:var(--acc);cursor:pointer;display:grid;place-items:center;font:700 11px var(--display);gap:2px;padding:6px 2px}
.dl svg{width:20px;height:20px}
.dl:hover{background:var(--soft)}
.dl:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.dl[disabled]{opacity:.55;cursor:default}
body:not(.can-dl) .dl, body:not(.can-dl) #pdl{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--brown);color:#fff;font:700 14px var(--display);padding:10px 18px;border-radius:999px;z-index:30;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.clip[disabled] .n{background:#C8B8A6}
.note{text-align:center;color:var(--muted);font-family:var(--display);font-size:13px}
/* player */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(59,42,31,.72);display:flex;align-items:center;justify-content:center;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(12px, env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px, env(safe-area-inset-left,0px))}
.panel{background:var(--card);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:10px;max-height:100%;width:min(480px,100%);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.panel h3{margin:0;font-family:var(--display);font-weight:800;color:var(--brown);font-size:16px;line-height:1.6;text-align:center}
.panel video{width:100%;max-height:calc(100vh - 190px);aspect-ratio:9/16;object-fit:contain;background:#000;border-radius:16px;display:block}
.ctrls{display:flex;gap:8px;justify-content:space-between}
.ctrls button{flex:1;font-family:var(--display);font-weight:700;font-size:14px;color:var(--brown);background:#F5EAD6;border:1.5px solid var(--brown-l);border-radius:12px;padding:9px 8px;cursor:pointer}
.ctrls button:disabled{opacity:.4;cursor:default}
.ctrls .close{background:var(--brown);color:#fff;border-color:var(--brown)}
@media (prefers-reduced-motion: reduce){.clip{transition:none}}
</style>

    <h1>أصول الشبهات حول القرآن الكريم</h1>
    <p class="sub">المقاطع المرئية على المذكرة المعتمدة</p>
    <p class="sub">مقرر أصول الشبهات حول القرآن الكريم (QRIN6018) · ماجستير التفسير وعلوم القرآن</p>
    <p class="sub">إشراف: الدكتورة خلود نشار</p>
    <div class="meter" id="meter"></div>
  </header>
  <div id="sections"></div>
  <p class="note">اضغطي على عنوان المقطع لمشاهدته، وعلى «تحميل» لحفظه على جهازك.</p>
  <div class="toast" id="toast" hidden></div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="ptitle">
    <h3 id="ptitle"></h3>
    <video id="vid" controls playsinline preload="metadata"></video>
    <div class="ctrls">
      <button id="prev" type="button">السابق</button>
      <button id="pdl" type="button">تحميل</button>
      <button id="close" class="close" type="button">إغلاق</button>
      <button id="next" type="button">التالي</button>
    </div>
  </div>
</div>

<script>
const SECTIONS=[
 {k:"s1",num:"القسم الأول",name:"نص المحاضرة",from:1,to:8},
 {k:"s2",num:"القسم الثاني",name:"مذكرة الدكتورة",from:9,to:18},
 {k:"s3",num:"القسم الثالث",name:"منهج القرآن الكريم في الرد على الشبهات",from:19,to:26},
 {k:"s4",num:"القسم الرابع",name:"دعوى تعارض القرآن مع الوقائع التاريخية",from:27,to:32},
 {k:"s5",num:"القسم الخامس",name:"دعوى تعارض القرآن مع الحقائق الكونية",from:33,to:37}];
const CLIPS=[{"n": 1, "t": "الشبهة والطعن في القرآن", "u": "videos/v01.mp4", "d": 156}, {"n": 2, "t": "المصطلحات المرادفة للطعن", "u": "videos/v02.mp4", "d": 240}, {"n": 3, "t": "تاريخ الطعن في القرآن", "u": "videos/v03.mp4", "d": 289}, {"n": 4, "t": "الطاعنون في القرن الرابع عشر", "u": "videos/v04.mp4", "d": 190}, {"n": 5, "t": "لماذا هذه الحرب على القرآن؟", "u": "videos/v05.mp4", "d": 304}, {"n": 6, "t": "أنواع المطاعن الرئيسية", "u": "videos/v06.mp4", "d": 141}, {"n": 7, "t": "منهج القرآن في الرد: القواعد ١–٥", "u": "videos/v07.mp4", "d": 370}, {"n": 8, "t": "منهج القرآن في الرد: القواعد ٦–١٠", "u": "videos/v08.mp4", "d": 226}, {"n": 9, "t": "القراءات: تعريفها ونشأتها", "u": "videos/v09.mp4", "d": 145}, {"n": 10, "t": "مصدر القراءات وشروط قبولها", "u": "videos/v10.mp4", "d": 152}, {"n": 11, "t": "الأحرف السبعة: الأحاديث ومعنى الحرف", "u": "videos/v11.mp4", "d": 182}, {"n": 12, "t": "حكمة الأحرف السبعة وعلاقتها بالقراءات", "u": "videos/v12.mp4", "d": 146}, {"n": 13, "t": "شبهتا الاختلاف والقراءات السبع", "u": "videos/v13.mp4", "d": 223}, {"n": 14, "t": "شبهتا لغة قريش وعمر وهشام", "u": "videos/v14.mp4", "d": 220}, {"n": 15, "t": "شبهتا الاستبدال وحقيقة العدد", "u": "videos/v15.mp4", "d": 349}, {"n": 16, "t": "أول ما نزل على الإطلاق", "u": "videos/v16.mp4", "d": 465}, {"n": 17, "t": "آخر ما نزل: الأقوال الأولى", "u": "videos/v17.mp4", "d": 281}, {"n": 18, "t": "آخر ما نزل: بقية الأقوال والراجح", "u": "videos/v18.mp4", "d": 284}, {"n": 19, "t": "تعريفات البحث: المنهج والشبهة والقواعد", "u": "videos/v19.mp4", "d": 259}, {"n": 20, "t": "خصائص المنهج القرآني", "u": "videos/v20.mp4", "d": 452}, {"n": 21, "t": "القاعدتان الأولى والثانية", "u": "videos/v21.mp4", "d": 137}, {"n": 22, "t": "القاعدة الثالثة: المناسبة بين الشبهة وجوابها", "u": "videos/v22.mp4", "d": 166}, {"n": 23, "t": "القاعدتان الرابعة والخامسة", "u": "videos/v23.mp4", "d": 181}, {"n": 24, "t": "القاعدتان السادسة والسابعة", "u": "videos/v24.mp4", "d": 208}, {"n": 25, "t": "القاعدتان الثامنة والتاسعة", "u": "videos/v25.mp4", "d": 201}, {"n": 26, "t": "القاعدتان العاشرة والحادية عشرة", "u": "videos/v26.mp4", "d": 203}, {"n": 27, "t": "دعوى تعارض القرآن مع الوقائع التاريخية: نشأتها ومن قال بها", "u": "videos/v27.mp4", "d": 159}, {"n": 28, "t": "الردود الإجمالية الأربعة عشر", "u": "videos/v28.mp4", "d": 162}, {"n": 29, "t": "عيسى عليه السلام في المهد، وهامان", "u": "videos/v29.mp4", "d": 176}, {"n": 30, "t": "يا أخت هارون وأصنام قوم نوح", "u": "videos/v30.mp4", "d": 182}, {"n": 31, "t": "قصة لوط عليه السلام ودعوى أساطير الأولين", "u": "videos/v31.mp4", "d": 160}, {"n": 32, "t": "سليمان عليه السلام وبلقيس والهدهد", "u": "videos/v32.mp4", "d": 258}, {"n": 33, "t": "الضابطان والرد الإجمالي", "u": "videos/v33.mp4", "d": 267}, {"n": 34, "t": "العسل ودعوى أن الأرض ثابتة", "u": "videos/v34.mp4", "d": 202}, {"n": 35, "t": "الكواكب، والفضاء، وجبل قاف", "u": "videos/v35.mp4", "d": 160}, {"n": 36, "t": "ستة أيام، ونظرية التطور", "u": "videos/v36.mp4", "d": 155}, {"n": 37, "t": "عين حمئة، والسقف المحفوظ، والمصابيح، ومن الأرض مثلهن", "u": "videos/v37.mp4", "d": 177}];
const ar=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const ready=CLIPS.filter(c=>c.u);
const mmss=s=>ar(Math.floor(s/60))+":"+ar(String(s%60).padStart(2,"0"));
const hrs=x=>x===1?'ساعة':x===2?'ساعتان':ar(x)+(x<=10?' ساعات':' ساعة');
const totalMin=Math.round(CLIPS.reduce((a,c)=>a+(c.d||0),0)/60);
document.getElementById("meter").innerHTML='<span class="star" aria-hidden="true"></span><span class="chipx">'+ar(ready.length)+' مقطعًا</span><span class="chipx">خمسة أقسام</span><span class="chipx">'+hrs(Math.floor(totalMin/60))+' و'+ar(totalMin%60)+' دقيقة</span><span class="star" aria-hidden="true"></span>';
const box=document.getElementById("sections");
for(const s of SECTIONS){
  const sec=document.createElement("section"); sec.className="sec "+s.k;
  const list=CLIPS.filter(c=>c.n>=s.from&&c.n<=s.to); const r=list.filter(c=>c.u).length;
  sec.innerHTML='<h2><span class="num">'+s.num+'</span><span></span><small>'+ar(list.length)+' مقاطع</small></h2><div class="grid"></div>';
  sec.querySelector("h2 span:nth-child(2)").textContent=s.name;
  const g=sec.querySelector(".grid");
  for(const c of list){
    const b=document.createElement("button"); b.type="button"; b.className="clip"; b.id="clip-"+c.n;
    b.innerHTML='<span class="n">'+ar(c.n)+'</span><span class="t"></span>'+(c.u?'<span class="play" aria-hidden="true"></span>':'<span class="st">قيد الإعداد</span>');
    b.querySelector(".t").textContent=c.t; if(c.d){ const du=document.createElement("span"); du.className="du"; du.textContent="المدة "+mmss(c.d); b.querySelector(".t").appendChild(du); }
    if(!c.u) b.disabled=true; else b.addEventListener("click",()=>openClip(c.n));
    const row=document.createElement("div"); row.className="row"; row.appendChild(b);
    if(c.u){ const d=document.createElement("button"); d.type="button"; d.className="dl"; d.setAttribute("aria-label","تحميل المقطع "+ar(c.n));
      d.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg><span>تحميل</span>';
      d.addEventListener("click",()=>download(c.n,d)); row.appendChild(d); }
    g.appendChild(row);
  }
  box.appendChild(sec);
}
const sheet=document.getElementById("sheet"), vid=document.getElementById("vid"), pt=document.getElementById("ptitle");
let cur=null;
function openClip(n){ const c=CLIPS.find(x=>x.n===n); if(!c||!c.u) return; cur=n;
  pt.textContent="المقطع "+ar(n)+" · "+c.t; vid.src=c.u; sheet.hidden=false;
  const i=ready.findIndex(x=>x.n===n); document.getElementById("prev").disabled=i<=0; document.getElementById("next").disabled=i>=ready.length-1;
  vid.play().catch(()=>{}); }
function closeClip(){ vid.pause(); vid.removeAttribute("src"); vid.load(); sheet.hidden=true; const b=document.getElementById("clip-"+cur); if(b) b.focus(); }
document.getElementById("close").onclick=closeClip;
sheet.addEventListener("click",e=>{ if(e.target===sheet) closeClip(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!sheet.hidden) closeClip(); });
document.getElementById("prev").onclick=()=>{ const i=ready.findIndex(x=>x.n===cur); if(i>0) openClip(ready[i-1].n); };
document.body.classList.add("can-dl");
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>{el.hidden=true;},3500); }
function download(n,btn){
  const c=CLIPS.find(x=>x.n===n); if(!c) return;
  const name=("المقطع "+String(n).padStart(2,"0")+" - "+c.t).replace(/[\\/:*?"<>|﴿﴾]/g," ").replace(/\s+/g," ").trim()+".mp4";
  const a=document.createElement("a"); a.href=c.u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  toast("بدأ تحميل المقطع "+ar(n));
}
document.getElementById("pdl").onclick=e=>{ if(cur) download(cur,e.currentTarget); };
document.getElementById("next").onclick=()=>{ const i=ready.findIndex(x=>x.n===cur); if(i<ready.length-1) openClip(ready[i+1].n); };
</script>

</body>
</html>
